<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mail Validation System</title>
    <link rel="stylesheet" href="mail.css">
</head>
<body>
    <div class="container-div">
        <div id="main-div">
            <div id="register-div">
                <h1>Register</h1>
                <p>Signup now and get full access to our app.</p>
            </div>
            <div id="form-div">
                <div id="username">
                    <input type="text" name="firstname" class="firstname user" placeholder="Firstname" id="firstname">
                    <input type="text" name="lastname" class="lastname user" placeholder="Lastname" id="lastname">
                </div>
                <input type="email" name="mail" placeholder="Emial" id="email">
                <input type="password" name="pass" placeholder="Password" id="password">
                <input type="password" name="pass"  placeholder="Confirm password" id="confirm-password">
                <button >Submit </button>
            </div>
            <div id="signin">
                <p>Already have an account ?</p>
                <span>Signin</span>
            </div>
        </div>
    </div>

    <script src="mail.js"></script>
</body>
</html>
